name: WebApp CI-Build

on:
  push:
    branches: [main, develop, 'feature/*']
    paths:
      - 'webclient/**'
      - '.github/workflows/webapp-ci-build.yaml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'webclient/**'
      - '.github/workflows/webapp-ci-build.yaml'
  schedule:
    - cron: '0 2 * * *'  # Nightly build at 2 AM

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./webclient/timeasy-webclient

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: './webclient/timeasy-webclient/package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint
        continue-on-error: true

      - name: Test
        run: npm run test -- --watch=false --browsers=ChromeHeadless

      - name: Build
        run: npm run build

  docker:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
              uses: docker/metadata-action@v5
        with:
          images: timeasy/webapp
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}},enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./webclient/timeasy-webclient
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
