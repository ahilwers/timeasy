name: Flutter CI-Build

on:
  push:
    paths:
      - "tracking-app/**"
      - ".github/workflows/flutter-ci-build.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./tracking-app

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          cache: true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true
          log-accepted-android-sdk-licenses: true
          packages: platforms;android-35 build-tools;35.0.0 platform-tools ndk;26.1.10909125

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --release \
            --dart-define=LOKI_ENDPOINT=${{ secrets.LOKI_ENDPOINT }} \
            --dart-define=LOKI_BEARER_TOKEN=${{ secrets.LOKI_BEARER_TOKEN }} \
            --dart-define=ENVIRONMENT=production
        env:
          LOKI_ENDPOINT: ${{ secrets.LOKI_ENDPOINT }}
          LOKI_BEARER_TOKEN: ${{ secrets.LOKI_BEARER_TOKEN }}

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeasy-apk-${{ github.sha }}
          path: tracking-app/build/app/outputs/flutter-apk/app-release.apk

  build-ios:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ./tracking-app
    if: github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.24.x"
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Generate localization files
        run: flutter gen-l10n

      - name: Build iOS (no codesign)
        run: |
          flutter build ios --release --no-codesign \
            --dart-define=LOKI_ENDPOINT=${{ secrets.LOKI_ENDPOINT }} \
            --dart-define=LOKI_BEARER_TOKEN=${{ secrets.LOKI_BEARER_TOKEN }} \
            --dart-define=ENVIRONMENT=production
        env:
          LOKI_ENDPOINT: ${{ secrets.LOKI_ENDPOINT }}
          LOKI_BEARER_TOKEN: ${{ secrets.LOKI_BEARER_TOKEN }}

      - name: Upload iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: timeasy-ios-${{ github.sha }}
          path: tracking-app/build/ios/iphoneos/Runner.app
