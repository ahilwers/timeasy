<div class="header-container">
  <h1>{{ 'weeklyOverview.headline' | translate}} {{this.selectedWeekNumber()}}/{{this.selectedYear()}}</h1>
</div>

<p-toast></p-toast>

@if (weeklyStatistics()) {
  <p-table [value]="weeklyStatistics()!.days" [tableStyle]="{ 'min-width': '50rem' }">
    <ng-template #body let-day>
      <tr>
        <td style="text-align: left; width: auto;">{{ day.weekday }}</td>
        <td style="text-align: right; width: 100px;">{{ day.timeInSeconds | secondsToTime }}</td>
      </tr>
    </ng-template>
  </p-table>
  <div class="navigation-button-container">
    <p-button icon="pi pi-chevron-left" (onClick)="previousWeek()"></p-button>
    <p-button icon="pi pi-chevron-right" (onClick)="nextWeek()"></p-button>
  </div>
}
